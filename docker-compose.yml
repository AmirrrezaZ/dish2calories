# CPU by default:      docker compose up --build
# With an NVIDIA GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: dish2calories-api
    command: python inference.py
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: dish2calories-ui
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      # Reach the API through the compose network
      API_URL: "http://api:8000"
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: dish2calories-net
